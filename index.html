<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Emotional Journey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: one "screen" inside a cardboard tablet frame, like the real kit; a click-through guide with animated demos. */
:root {
  /* One bright look on purpose: no dark mode. */
  color-scheme: light;
  --paper: #FFF7E8;
  --dots: #FFD9A3;
  --screen: #FFFFFF;
  --ink: #1C1B1F;
  --ink-soft: #57535F;
  --line: #EFE6D6;
  --card: #FF8A5C;             /* bright coral for boxes, buttons and pins */
  --card-ink: #1C1B1F;
  --card-tint: #FFEDE4;
  --kraft: #EDC793;
  --kraft-dark: #D6A96C;
  --kraft-light: #F7DFB8;
  --focus: #2E5BD9;
  --z-charged: #FF6B6B;  --z-bright: #FFD93D;  --z-low: #6CB8FF;  --z-calm: #5BD98F;
  --t-charged: #FF5252;  --t-bright: #FFD21F;  --t-low: #40C4F2;  --t-calm: #34C77B;
  --font-display: "Fraunces", "Georgia", "Times New Roman", serif;
  --font-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  --font-hand: "Caveat", "Comic Sans MS", "Marker Felt", cursive;
}
* { box-sizing: border-box; }
body {
  background-color: var(--paper);
  background-image: radial-gradient(var(--dots) 1.2px, transparent 1.3px);
  background-size: 22px 22px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 32px;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- cardboard tablet ---------- */
.tablet {
  max-width: 480px; margin: 0 auto; padding: 14px 14px 44px; border-radius: 30px; position: relative;
  background: repeating-linear-gradient(0deg, transparent 0 5px, rgba(0,0,0,.05) 5px 6px), var(--kraft);
  box-shadow: inset 0 0 0 2px var(--kraft-dark), 0 10px 26px rgba(120, 80, 20, .16);
}
.tablet::after {
  content: ""; position: absolute; left: 50%; bottom: 13px; width: 18px; height: 18px; margin-left: -9px;
  border-radius: 50%; background: var(--kraft-light); box-shadow: inset 0 0 0 2px var(--kraft-dark);
}
.screen {
  background: var(--screen); border-radius: 18px; min-height: 620px; padding: 18px 20px 20px;
  display: flex; flex-direction: column; gap: 16px; overflow: hidden;
}
.screen.paused * { animation-play-state: paused !important; }

/* ---------- top bar ---------- */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 28px; }
.dots { display: flex; gap: 6px; align-items: center; }
.dot { width: 9px; height: 9px; border-radius: 5px; background: var(--line); transition: width .25s, background .25s; }
.dot.on { background: var(--card); }
.dot.now { width: 24px; background: var(--card); }
.stepnum { font-size: 14px; font-weight: 700; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

/* ---------- step content ---------- */
.step { display: flex; flex-direction: column; gap: 16px; flex: 1; animation: in .35s ease both; }
@keyframes in { from { opacity: .001; transform: translateX(14px); } to { opacity: 1; transform: none; } }
.kicker { font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #B84A22; }
h1, h2 { font-family: var(--font-display); font-weight: 800; margin: 0; line-height: 1.08; letter-spacing: -0.01em; text-wrap: balance; }
h1 { font-size: clamp(31px, 8.6vw, 38px); }
h2 { font-size: clamp(25px, 7vw, 30px); }
.head { display: flex; flex-direction: column; gap: 4px; }
p { margin: 0; }
.lead { font-size: 17.5px; color: var(--ink-soft); }
.lead b { color: var(--ink); }

.coralbox {
  background: var(--card); color: var(--card-ink); border-radius: 18px; padding: 14px 16px;
  font-family: var(--font-display); font-weight: 600; font-size: 17px; line-height: 1.25; text-align: center; text-wrap: balance;
}

/* welcome sticky notes */
.notes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 4px; }
.note {
  padding: 14px 8px 12px; border-radius: 4px; text-align: center; min-width: 0;
  box-shadow: 0 2px 0 rgba(0,0,0,.06), 0 6px 12px rgba(0,0,0,.08);
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  animation: pop .5s cubic-bezier(.2,1.5,.4,1) both;
}
.note b { font-family: var(--font-display); font-size: 34px; line-height: 1; }
.note span { font-family: var(--font-hand); font-size: 21px; line-height: 1.05; }
.note:nth-child(1) { background: var(--z-bright); --r: -3deg; animation-delay: .1s; }
.note:nth-child(2) { background: #B6F2CF; color: #12402A; --r: 2deg; animation-delay: .25s; }
.note:nth-child(3) { background: #FFC4DA; color: #5C1534; --r: -1.5deg; animation-delay: .4s; }
.note { transform: rotate(var(--r)); }
@keyframes pop { from { opacity: .001; transform: scale(.4) rotate(0); } to { opacity: 1; transform: scale(1) rotate(var(--r)); } }
.toc { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.toc li { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: center; font-weight: 700; }
.toc .n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 800; }

/* photos with washi tape */
.photo { position: relative; margin: 10px 4px 0; }
.photo img { display: block; width: 100%; border-radius: 6px; border: 6px solid #FFF; box-shadow: 0 4px 14px rgba(0,0,0,.14); transform: rotate(-1deg); }
.photo::before, .photo::after {
  content: ""; position: absolute; top: -10px; width: 86px; height: 24px; z-index: 2;
  background: repeating-linear-gradient(45deg, rgba(255,255,255,.35) 0 6px, transparent 6px 12px), rgba(255, 210, 31, .8);
}
.photo::before { left: 14px; transform: rotate(-8deg); }
.photo::after { right: 14px; transform: rotate(7deg); background-color: rgba(255, 107, 107, .75); }
.pin {
  position: absolute; z-index: 3; width: 34px; height: 34px; border-radius: 50%;
  background: var(--card); color: var(--card-ink); border: 3px solid #FFF;
  display: grid; place-items: center; font-weight: 800; font-size: 15px;
  box-shadow: 0 2px 6px rgba(0,0,0,.25); transform: translate(-50%, -50%);
  animation: pinpop .45s cubic-bezier(.2,1.6,.4,1) both; transition: transform .25s, background .25s;
}
.pin:nth-of-type(1) { animation-delay: .2s; } .pin:nth-of-type(2) { animation-delay: .45s; }
.pin:nth-of-type(3) { animation-delay: .7s; } .pin:nth-of-type(4) { animation-delay: .95s; }
.pin.on { transform: translate(-50%, -50%) scale(1.3); background: var(--z-bright); }
@keyframes pinpop { from { opacity: .001; transform: translate(-50%, -50%) scale(0); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
.legend { display: grid; gap: 6px; padding: 0; margin: 0; list-style: none; }
.legend li { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: start; padding: 6px 8px; border-radius: 12px; transition: background .25s; }
.legend li.on { background: var(--card-tint); }
.legend .n { width: 28px; height: 28px; border-radius: 50%; background: var(--card); color: var(--card-ink); display: grid; place-items: center; font-weight: 800; font-size: 14px; }
.legend li.withthumb { grid-template-columns: 30px minmax(0, 1fr) 64px; }
.legend .thumb { width: 64px; height: 72px; object-fit: cover; object-position: top; border-radius: 6px; border: 3px solid #FFF; box-shadow: 0 2px 8px rgba(0,0,0,.15); transform: rotate(2deg); }
.fpage { position: relative; }
.fpage .photo { transition: opacity .35s, filter .35s; }
.fpage.hidden .photo { opacity: .3; filter: grayscale(.6); }
.fpage-hidden {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.9); z-index: 6;
  display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
  padding: 10px 16px; border-radius: 999px; background: #FFF; box-shadow: 0 4px 14px rgba(0,0,0,.18);
  font-weight: 800; opacity: 0; transition: opacity .35s, transform .35s;
}
.fpage.hidden .fpage-hidden { opacity: 1; transform: translate(-50%, -50%) scale(1); }
.scene { position: relative; padding: 6px 0 26px; }
.scene .sheet { transform: rotate(-1deg); }
.scene .overlay {
  position: absolute; top: 0; left: 50%; width: 74%; z-index: 4;
  transform: translateX(-50%) rotate(2deg); transition: transform .55s cubic-bezier(.5,0,.3,1), opacity .4s;
}
.scene .overlay img { display: block; width: 100%; border-radius: 6px; border: 5px solid #FFF; box-shadow: 0 8px 22px rgba(0,0,0,.25); }
.scene.no .overlay { transform: translateX(-50%) translateY(-60px) rotate(8deg); opacity: 0; }
.scene-tag {
  position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); z-index: 6;
  display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
  padding: 8px 14px; border-radius: 999px; background: #FFF; box-shadow: 0 4px 14px rgba(0,0,0,.18); font-weight: 800; font-size: 15px;
}
.switch.hide { background: #C9C3D3; }
.team { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.team li { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; background: var(--paper); border-radius: 14px; padding: 8px 10px 8px 14px; }
.team .who { font-weight: 800; min-width: 66px; }
.team .small-btn { padding: 4px 12px; min-height: 38px; }
.team .num { font-weight: 700; font-variant-numeric: tabular-nums; user-select: all; }
.faq .team { margin-top: 8px; }
.faq .team li { background: var(--screen); }

/* alarm */
.alarm-scene { display: grid; place-items: center; padding: 8px 0 2px; }
.clock { width: 150px; height: 150px; animation: ring 2.4s ease-in-out infinite; transform-origin: 50% 60%; }
@keyframes ring { 0%, 55%, 100% { transform: rotate(0); } 60% { transform: rotate(-12deg); } 65% { transform: rotate(12deg); } 70% { transform: rotate(-10deg); } 75% { transform: rotate(10deg); } 80% { transform: rotate(-6deg); } 85% { transform: rotate(0); } }
.tabdemo { display: flex; align-items: center; justify-content: center; gap: 0; }
.tabdemo .pg { width: 160px; height: 96px; border-radius: 8px; background: #FFF; box-shadow: 0 0 0 2px var(--line), 0 6px 14px rgba(0,0,0,.08); display: grid; grid-template-columns: repeat(2, 1fr); padding: 10px; gap: 0; }
.tabdemo .pg span { display: block; }
.tabdemo .tab { align-self: flex-start; margin-top: 16px; padding: 6px 12px; border-radius: 0 8px 8px 0; background: #CFE9DB; font-weight: 800; font-size: 13px; letter-spacing: .06em; animation: tug 2.4s ease-in-out infinite; }
@keyframes tug { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(8px); } }
.facts { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.facts li { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; align-items: center; }
.facts .ic { width: 40px; height: 40px; border-radius: 12px; background: var(--card-tint); display: grid; place-items: center; }

/* mood map demo */
.mapwrap { position: relative; }
.map { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-radius: 6px; overflow: hidden; border: 3px solid #FFF; box-shadow: 0 0 0 1px var(--line); }
.zone {
  min-height: 118px; padding: 12px 14px; font-family: var(--font-display); font-weight: 800; font-size: 18px; line-height: 1.12;
  color: var(--ink); transition: opacity .35s, box-shadow .35s; opacity: .45;
}
.zone.on { opacity: 1; box-shadow: inset 0 0 0 5px #FFF; }
.zone[data-z="charged"] { background: var(--z-charged); }
.zone[data-z="bright"] { background: var(--z-bright); }
.zone[data-z="low"] { background: var(--z-low); }
.zone[data-z="calm"] { background: var(--z-calm); }
.finger {
  position: absolute; width: 46px; height: 46px; pointer-events: none; z-index: 4;
  left: 70%; top: 70%; transition: left .6s cubic-bezier(.5,0,.3,1), top .6s cubic-bezier(.5,0,.3,1);
  filter: drop-shadow(0 3px 4px rgba(0,0,0,.25));
}
.finger.tap svg { animation: tap .35s ease .55s; }
@keyframes tap { 50% { transform: scale(.82); } }
.ripple { position: absolute; width: 60px; height: 60px; margin: -14px 0 0 -14px; border-radius: 50%; border: 3px solid #FFF; opacity: 0; z-index: 3; pointer-events: none; }
.finger.tap + .ripple { animation: rip .6s ease-out .6s; }
@keyframes rip { from { opacity: .9; transform: scale(.3); } to { opacity: 0; transform: scale(1.4); } }
.explain {
  border-radius: 16px; padding: 12px 14px; background: var(--paper); min-height: 92px;
  display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 10px; align-items: start;
}
.explain .sw { width: 18px; height: 18px; border-radius: 5px; margin-top: 3px; }
.explain b { display: block; font-weight: 800; }
.explain span { color: var(--ink-soft); font-size: 15.5px; }
.fade { animation: fadein .35s ease both; }
@keyframes fadein { from { opacity: .001; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.pause { align-self: flex-end; border: 2px solid var(--line); background: var(--screen); border-radius: 999px; padding: 4px 12px 4px 8px; min-height: 36px; font-size: 13px; font-weight: 800; color: var(--ink-soft); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }

/* word tiles demo */
.tilegroup { border-radius: 16px; padding: 12px; background: var(--paper); display: flex; flex-direction: column; gap: 10px; min-height: 150px; }
.tilegroup .lbl { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 15px; }
.tilegroup .lbl i { width: 16px; height: 16px; border-radius: 4px; display: inline-block; }
.tiles { display: flex; flex-wrap: wrap; gap: 8px; }
.tile {
  padding: 4px 13px 6px; border-radius: 3px; color: var(--ink);
  font-family: var(--font-hand); font-weight: 700; font-size: 24px; line-height: 1.1;
  box-shadow: 0 2px 0 rgba(0,0,0,.1), 0 4px 10px rgba(0,0,0,.08);
  animation: deal .4s cubic-bezier(.2,1.4,.4,1) both;
}
.tile:nth-child(odd) { --r: -1.5deg; } .tile:nth-child(even) { --r: 1.2deg; }
.tile { transform: rotate(var(--r)); }
.tile:nth-child(2) { animation-delay: .06s; } .tile:nth-child(3) { animation-delay: .12s; }
.tile:nth-child(4) { animation-delay: .18s; } .tile:nth-child(5) { animation-delay: .24s; }
@keyframes deal { from { opacity: .001; transform: translateY(-12px) rotate(-10deg); } to { opacity: 1; transform: rotate(var(--r)); } }
.blankrow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.blank {
  min-width: 132px; min-height: 44px; padding: 4px 14px 6px; border-radius: 3px; background: var(--t-calm);
  font-family: var(--font-hand); font-weight: 700; font-size: 24px; display: inline-flex; align-items: center;
  box-shadow: 0 2px 0 rgba(0,0,0,.1), 0 4px 10px rgba(0,0,0,.08); transform: rotate(-1deg);
}
.blank .caret { display: inline-block; width: 2px; height: 22px; margin-left: 2px; background: var(--ink); animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* sheet demo */
.sheet { position: relative; background: #FFF; border-radius: 6px; padding: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.12); transform: rotate(-1deg); display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
.sheet .coralbox { font-size: 14px; padding: 10px 12px; border-radius: 12px; }
.mini { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.q { min-height: 104px; padding: 8px 10px; font-family: var(--font-display); font-weight: 800; font-size: 13px; line-height: 1.1; position: relative; color: var(--ink); }
.drop {
  position: absolute; left: 50%; top: 58%; padding: 3px 12px 5px; border-radius: 2px; background: var(--t-bright);
  font-family: var(--font-hand); font-weight: 700; font-size: 22px; white-space: nowrap;
  box-shadow: 0 2px 0 rgba(0,0,0,.15), 0 4px 10px rgba(0,0,0,.2);
  animation: dropin 3.2s cubic-bezier(.3,1.3,.5,1) infinite;
}
@keyframes dropin {
  0% { opacity: 0; transform: translate(-50%, -150px) rotate(-18deg); }
  12% { opacity: 1; }
  35%, 80% { opacity: 1; transform: translate(-50%, -50%) rotate(-4deg); }
  100% { opacity: 0; transform: translate(-50%, -50%) rotate(-4deg); }
}
.flash { position: absolute; inset: 0; background: #FFF; opacity: 0; animation: flash 4s ease infinite; z-index: 5; }
@keyframes flash { 0%, 38% { opacity: 0; } 42% { opacity: .95; } 55%, 100% { opacity: 0; } }
.viewfinder { position: absolute; inset: 8px; z-index: 4; pointer-events: none; animation: vf 4s ease infinite; }
.viewfinder i { position: absolute; width: 26px; height: 26px; border: 4px solid var(--ink); }
.viewfinder i:nth-child(1) { left: 0; top: 0; border-right: 0; border-bottom: 0; }
.viewfinder i:nth-child(2) { right: 0; top: 0; border-left: 0; border-bottom: 0; }
.viewfinder i:nth-child(3) { left: 0; bottom: 0; border-right: 0; border-top: 0; }
.viewfinder i:nth-child(4) { right: 0; bottom: 0; border-left: 0; border-top: 0; }
@keyframes vf { 0% { opacity: 0; transform: scale(1.12); } 15%, 45% { opacity: 1; transform: scale(1); } 60%, 100% { opacity: 0; transform: scale(1); } }
.sentrow { display: flex; align-items: center; gap: 10px; justify-content: center; min-height: 44px; }
.plane { animation: fly 4s ease-in-out infinite; }
@keyframes fly { 0%, 50% { opacity: 0; transform: translate(-30px, 10px); } 62% { opacity: 1; } 80% { opacity: 1; transform: translate(0, 0); } 100% { opacity: 0; transform: translate(30px, -10px); } }
.sentchip { padding: 6px 14px; border-radius: 999px; background: #B6F2CF; font-weight: 800; font-size: 15px; animation: chip 4s ease infinite; }
@keyframes chip { 0%, 66% { opacity: 0; transform: scale(.8); } 74%, 94% { opacity: 1; transform: scale(1); } 100% { opacity: 0; } }
.contact { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--paper); border-radius: 14px; padding: 10px 12px; }
.contact .who { font-weight: 800; }
.contact .num { font-weight: 800; font-size: 18px; user-select: all; font-variant-numeric: tabular-nums; }
.small-btn { border: 2px solid var(--ink); background: transparent; border-radius: 999px; padding: 6px 14px; font-weight: 800; font-size: 14px; cursor: pointer; min-height: 40px; margin-left: auto; }

/* share or hide demo */
.switchrow { display: flex; align-items: center; justify-content: center; gap: 12px; font-weight: 800; }
.switchrow .lab { transition: color .3s; color: var(--ink-soft); display: inline-flex; align-items: center; gap: 6px; }
.switchrow .lab.on { color: var(--ink); }
.switch { width: 64px; height: 36px; border-radius: 999px; background: var(--z-calm); position: relative; transition: background .35s; flex-shrink: 0; }
.switch::after { content: ""; position: absolute; top: 4px; left: 4px; width: 28px; height: 28px; border-radius: 50%; background: #FFF; box-shadow: 0 2px 4px rgba(0,0,0,.2); transition: transform .35s cubic-bezier(.5,0,.3,1); }
.switch.hide { background: #C9C3D3; }
.switch.hide::after { transform: translateX(28px); }
.friend {
  border-radius: 16px; padding: 14px 16px; border: 5px solid #FFF; box-shadow: 0 0 0 1px var(--line);
  display: grid; grid-template-columns: minmax(0, 1fr) 50px; gap: 12px; align-items: center;
  transition: opacity .35s, filter .35s; color: var(--ink);
}
.friend .who { font-family: var(--font-display); font-style: italic; font-weight: 700; font-size: 24px; line-height: 1.1; }
.friend .what { font-family: var(--font-display); font-weight: 600; font-size: 15.5px; line-height: 1.3; }
.friend .ava { width: 50px; height: 50px; border-radius: 50%; background: #FFF; display: grid; place-items: center; }
.friend.hidden { opacity: .35; border-style: dashed; }
.twocol { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.twocol div { border-radius: 14px; padding: 10px 12px; background: var(--paper); font-size: 15px; color: var(--ink-soft); min-width: 0; }
.twocol b { display: flex; align-items: center; gap: 6px; color: var(--ink); font-size: 16px; }
details.peek { border-top: 1.5px dashed var(--line); padding-top: 12px; }
details.peek summary { cursor: pointer; font-weight: 800; font-size: 15px; color: var(--ink-soft); }
details.peek .photo { margin-top: 18px; }

/* journey */
.journey { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; align-items: start; text-align: center; position: relative; }
.day { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; overflow-wrap: anywhere; font-size: 13px; font-weight: 700; color: var(--ink-soft); line-height: 1.25; }
.day .c { width: 54px; height: 54px; border-radius: 50%; border: 2.5px dashed #C9C3D3; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 20px; color: var(--ink); transition: background .35s, border-color .35s, transform .35s; }
.day.lit .c { border-style: solid; border-color: var(--card); background: var(--card); transform: scale(1.08); }
.day.gift .c { border: 0; background: var(--z-bright); }
.day.gift.lit .c { animation: wobble .7s ease; }
@keyframes wobble { 25% { transform: rotate(-12deg) scale(1.15); } 50% { transform: rotate(10deg) scale(1.15); } 75% { transform: rotate(-6deg) scale(1.1); } }
.day b { color: var(--ink); }
.faq { display: grid; gap: 8px; }
.faq details { background: var(--paper); border-radius: 12px; padding: 10px 14px; }
.faq summary { cursor: pointer; font-weight: 800; }
.faq details p { margin-top: 6px; color: var(--ink-soft); }

/* bottom nav */
.nav { display: flex; gap: 10px; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 6px; }
.btn {
  border: 0; cursor: pointer; border-radius: 999px; min-height: 54px; padding: 0 26px;
  background: var(--card); color: var(--card-ink); font-weight: 800; font-size: 18px;
  display: inline-flex; align-items: center; gap: 10px; justify-content: center;
}
.btn.wide { flex: 1; }
.btn svg { transition: transform .2s; }
.btn:hover svg { transform: translateX(3px); }
.back { border: 0; background: transparent; cursor: pointer; font-weight: 800; color: var(--ink-soft); min-height: 48px; padding: 0 8px; }

@media (max-width: 420px) {
  .tablet { padding: 9px 9px 38px; border-radius: 24px; }
  .screen { padding: 16px 14px 16px; min-height: 580px; }
  .zone { min-height: 104px; font-size: 16px; padding: 10px 12px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .drop { opacity: 1; transform: translate(-50%, -50%) rotate(-4deg); }
  .sentchip, .plane { opacity: 1; }
}

html { -webkit-text-size-adjust: 100%; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
.noscript { max-width: 480px; margin: 24px auto; padding: 16px; border-radius: 14px; background: #FFFFFF; font-weight: 700; text-align: center; }
</style>

      <li><span class="who">${esc(m.name)}</span><span class="num">${esc(m.shown)}</span>

  <div class="nav">
    <button class="back" type="button" data-act="back">Back</button>
    <button class="btn" type="button" data-act="next">${label} ${I.arrow}</button>
  </div>`;

const views = [
  // 0 · welcome
  () => `
    <h1>How your emotional journey works</h1>
    <p class="lead">This guide shows what's in your kit and what to do each day. It takes about a minute to read.</p>
    <div class="notes" role="list">
      <div class="note" role="listitem"><b>3</b><span>days</span></div>
      <div class="note" role="listitem"><b>2</b><span>times a day</span></div>
      <div class="note" role="listitem"><b>1</b><span>surprise at the end</span></div>
    </div>
    <ol class="toc" aria-label="Each check-in">
      <li><span class="n" style="background:var(--z-charged)">1</span>Pick a colour</li>
      <li><span class="n" style="background:var(--z-bright)">2</span>Find a word</li>
      <li><span class="n" style="background:var(--z-low)">3</span>Put it on the sheet</li>
      <li><span class="n" style="background:var(--z-calm)">4</span>Share with a friend? Take a photo</li>
      <li><span class="n" style="background:var(--card)">5</span>Send the photo</li>
    </ol>
    <div class="nav"><span></span><button class="btn wide" type="button" data-act="next">Show me how ${I.arrow}</button></div>`,

  // 1 · kit
  () => `
    <div class="head"><span class="kicker">Before you start</span><h2>What's in your kit</h2></div>
    <div class="photo">
      <img src="${KIT_PHOTO}" alt="The kit on a table: the check-in sheet with four colours, a cardboard tablet frame, and sheets of paper word tiles in red, yellow, blue and green.">
      <span class="pin" data-i="0" style="left:25%;top:22%">1</span>
      <span class="pin" data-i="1" style="left:73%;top:22%">2</span>
      <span class="pin" data-i="2" style="left:22%;top:66%">3</span>
      <span class="pin" data-i="3" style="left:91%;top:90%">4</span>
    </div>
    <ol class="legend">
      <li data-i="0"><span class="n">1</span><span><b>Check-in page.</b> Four colours, one for each kind of feeling.</span></li>
      <li data-i="1"><span class="n">2</span><span><b>Cardboard "phone".</b> The page you are using goes inside it.</span></li>
      <li data-i="2"><span class="n">3</span><span><b>Word tiles.</b> One colour for each corner of the check-in page.</span></li>
      <li data-i="3"><span class="n">4</span><span><b>Blank tiles.</b> For a feeling that has no tile yet.</span></li>
      <li data-i="4" class="withthumb"><span class="n">5</span><span><b>Friends page.</b> The page with the <b>FRIENDS</b> tab. It shows how the others feel. On days you want to share, it goes on top of the Check-in page.</span><img class="thumb" src="${FRIENDS_PHOTO}" alt="The Friends page with cards for You, Sandu, Catalina and Angela."></li>
    </ol>
    ${nav("Next")}`,

  // 2 · fixed time
  () => `
    <div class="head"><span class="kicker">Every day</span><h2>At ${esc(CONFIG.time)}, open the kit</h2></div>
    <div class="alarm-scene">${I.clock}</div>
    <div class="tabdemo" aria-hidden="true">
      <div class="pg"><span style="background:var(--z-charged)"></span><span style="background:var(--z-bright)"></span><span style="background:var(--z-low)"></span><span style="background:var(--z-calm)"></span></div>
      <span class="tab">CHECK-IN</span>

  // 3 · pick a colour
  () => `

  // 6 · share or hide
  () => `
    <div class="head"><span class="kicker">Step 4 of 5</span><h2>End of the day: would you share today with a friend?</h2></div>
    <div class="switchrow" aria-hidden="true">
      <span class="lab" id="labShare">Yes</span><span class="switch" id="switch"></span><span class="lab" id="labHide">No</span>
    </div>
    <div class="scene" id="scene" aria-hidden="true">
      <div class="sheet">
        <div class="coralbox">Tap the color that best describes how you feel right now</div>
        <div class="mini">
          ${ZONES.map((z) => `<div class="q" style="background:${z.color}">${z.label}${z.k === "bright" ? '<span class="drop" style="animation:none;opacity:1;transform:translate(-50%,-50%) rotate(-4deg)">Happy</span>' : ""}</div>`).join("")}
        </div>
      </div>
      <div class="overlay"><img src="${FRIENDS_PHOTO}" alt=""></div>
      <span class="scene-tag" id="sceneTag">${I.camera}<span id="sceneText">Photo: Friends page on top</span></span>
    </div>
    <div class="twocol">
      <div><b>Yes</b>Put the Friends page on top of the Check-in page in the tablet and take a photo.</div>
      <div><b>No</b>Take a photo of just the Check-in page.</div>
    </div>
    ${pauseBtn()}
    ${nav("Next")}`,

  // 7 · snap and send
  () => `
    <div class="head"><span class="kicker">Step 5 of 5</span><h2>Send the photo to one of us</h2></div>
    <p class="lead">Send the photo from step 4 to <b>one of us</b>, with or without the Friends page on top.</p>
    <div class="sheet" aria-hidden="true">
      <span class="viewfinder"><i></i><i></i><i></i><i></i></span><span class="flash"></span>
      <div class="coralbox">Tap the color that best describes how you feel right now</div>
      <div class="mini">
        ${ZONES.map((z) => `<div class="q" style="background:${z.color}">${z.label}${z.k === "bright" ? '<span class="drop" style="animation:none;opacity:1;transform:translate(-50%,-50%) rotate(-4deg)">Happy</span>' : ""}</div>`).join("")}
      </div>
    </div>
    <div class="sentrow" aria-hidden="true"><span class="plane">${I.plane}</span><span class="sentchip">Photo sent</span></div>
    ${teamList()}
    ${pauseBtn()}
    ${nav("Next")}`,

  // 8 · three evenings
  () => `
    <div class="head"><span class="kicker">The plan</span><h2>Three days, then a surprise</h2></div>
    <p class="lead">Do the five steps every day at <b>${esc(CONFIG.time)}</b>. If you like, add an extra check-in at any other time. After day 3 we meet for about 40 minutes, and you get a surprise made for you.</p>
    <div class="journey" aria-label="Your three days and the surprise">
      ${CONFIG.days.map((d, i) => `<div class="day" data-i="${i}"><span class="c">${i + 1}</span><span><b>${esc(d)}</b><br>${esc(CONFIG.time)}</span></div>`).join("")}
      <div class="day gift" data-i="3"><span class="c">${I.gift}</span><span><b>After day 3</b><br>a surprise</span></div>
    </div>
    <div class="faq">
      <details><summary>What if I miss a check-in?</summary><p>Do it as soon as you can and carry on. Tell one of us which day you missed.</p></details>
      <details><summary>Can I check in more than once a day?</summary><p>Yes. The ${esc(CONFIG.time)} check-in is the one everyone does. One extra check-in at another time is optional, and it helps us a lot.</p></details>
      <details><summary>What if none of the words fit?</summary><p>Write your own word on a blank tile in the colour you picked.</p></details>
      <details><summary>Who sees my check-ins?</summary><p>Our team sees the photos you send. Your check-in is only shared with a friend on the days you put the Friends page on top.</p></details>
      <details><summary>What happens after day 3?</summary><p>We meet for about 40 minutes: a few short tasks with the kit, some questions, and your surprise.</p></details>
      <details><summary>Who do I contact?</summary>${teamList()}</details>
    </div>
    ${pauseBtn()}
    <div class="nav"><button class="back" type="button" data-act="back">Back</button><button class="btn" type="button" data-act="restart">Back to start</button></div>`
];

/* ---------- step animations (run on a timer; Pause stops them) ---------- */
let step = 0, paused = false, timers = [];
const every = (ms, fn) => { fn(); timers.push(setInterval(() => { if (!paused) fn(); }, ms)); };
const after = (ms, fn) => timers.push(setTimeout(fn, ms));
const clearTimers = () => { timers.forEach((t) => { clearInterval(t); clearTimeout(t); }); timers = []; };

const setups = {
  1() {
    let i = -1;
    after(1300, () => every(1800, () => {
      i = (i + 1) % 5;
      document.querySelectorAll(".pin, .legend li").forEach((el) => el.classList.toggle("on", +el.dataset.i === i));
    }));
  },
  3() {
    let i = -1;
    const finger = $("#finger"), explain = $("#explain");
    every(2600, () => {
      i = (i + 1) % 4;
      const z = ZONES[i], [x, y] = SPOT[z.k];
      document.querySelectorAll(".zone").forEach((el) => el.classList.toggle("on", el.dataset.z === z.k));
      finger.style.left = `calc(${x}% - 6px)`; finger.style.top = `calc(${y}% - 4px)`;
      const rip = $("#ripple"); rip.style.left = finger.style.left; rip.style.top = finger.style.top;
      finger.classList.remove("tap"); void finger.offsetWidth; finger.classList.add("tap");
      explain.innerHTML = `<span class="sw" style="background:${z.color}"></span><div class="fade"><b>${z.label}</b><span>${z.means}</span></div>`;
    });
  },
  4() {
    let i = -1;
    const box = $("#tilegroup");
    every(2600, () => {
      i = (i + 1) % 4;
      const z = ZONES[i];
      box.innerHTML = `<span class="lbl fade"><i style="background:${z.color}"></i>${z.label}</span>
        <div class="tiles">${z.words.map((w) => `<span class="tile" style="background:${z.tile}">${w}</span>`).join("")}</div>`;
    });
    const word = "Relaxed", out = $("#typed");
    let n = 0, hold = 0;
    every(160, () => {
      if (n < word.length) { n++; out.textContent = word.slice(0, n); }
      else if (++hold > 12) { n = 0; hold = 0; out.textContent = ""; }
    });
  },
  6() {
    let hidden = true;
    every(2400, () => {
      hidden = !hidden;
      $("#switch").classList.toggle("hide", hidden);
      $("#labShare").classList.toggle("on", !hidden);
      $("#labHide").classList.toggle("on", hidden);
      $("#scene").classList.toggle("no", hidden);
      $("#sceneText").textContent = hidden ? "Photo: just the Check-in page" : "Photo: Friends page on top";
    });
  },
  8() {
    let i = -1;
    every(1300, () => {
      i = (i + 1) % 6;            /* 0–3 light up in turn, then two beats with everything lit */
      document.querySelectorAll(".day").forEach((el) => el.classList.toggle("lit", +el.dataset.i <= Math.min(i, 3)));
    });
  }
};

function render(focusHeading) {
  clearTimers();
  const v = $("#view");
  v.innerHTML = views[step]();
  v.style.animation = "none"; void v.offsetWidth; v.style.animation = "";
  $("#screen").classList.toggle("paused", paused);
  $("#dots").innerHTML = views.map((_, i) => `<span class="dot ${i < step ? "on" : ""} ${i === step ? "now" : ""}"></span>`).join("");
  $("#stepnum").textContent = `${step + 1} / ${views.length}`;
  if (setups[step]) setups[step]();
  if (focusHeading) {
    const h = v.querySelector("h1, h2");
    if (h) { h.setAttribute("tabindex", "-1"); h.focus({ preventScroll: true }); }
    document.querySelector(".tablet").scrollIntoView({ block: "start", behavior: "smooth" });
  }
}
const go = (n) => { step = Math.max(0, Math.min(views.length - 1, n)); render(true); };

$("#view").addEventListener("click", async (e) => {
  const t = e.target.closest("button");
  if (!t) return;
  const a = t.dataset.act;
  if (a === "next") return go(step + 1);
  if (a === "back") return go(step - 1);
  if (a === "restart") return go(0);
  if (a === "pause") {
    paused = !paused;
    $("#screen").classList.toggle("paused", paused);
    t.setAttribute("aria-pressed", paused);
    t.innerHTML = paused ? I.play + "Play animation" : I.pause + "Pause animation";
    return;
  }
  if (a === "copy") {
    try { await navigator.clipboard.writeText(t.dataset.num); t.textContent = "Copied"; }
    catch { const r = document.createRange(); r.selectNodeContents(t.previousElementSibling); const s = getSelection(); s.removeAllRanges(); s.addRange(r); t.textContent = "Selected"; }
  }
});

render(false);
</script>

</body>
</html>
